name: Automatic Gold Price Update

on:
  schedule:
    - cron: "0 4,15 * * *"
  workflow_dispatch:

jobs:
  update-gold-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Update Shopify product gold prices
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e
          curl --fail --show-error --silent --location \
            --max-time 180 \
            --retry 2 \
            --retry-delay 5 \
            --request GET \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "https://gold-price-updater-vx23.onrender.com/api/scheduled-price-update"