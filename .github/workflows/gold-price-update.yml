name: Automatic Gold Price Update

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  update-gold-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Update Shopify product gold prices
        run: |
          curl --fail --show-error --location \
            --max-time 180 \
            --request GET \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://gold-price-updater-vx23.onrender.com/api/scheduled-price-update"